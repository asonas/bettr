[package]
name = "bettr"
version = "0.1.0"
edition = "2024"
description = "Local issue tracking for agent work"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
uuid = { version = "1.18", features = ["serde", "v4"] }
whoami = "1.6"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.23"

[[bench]]
name = "cli_latency"
harness = false
