<!doctype html>
<html lang="en" data-bettr-autostart="true">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>bettr</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#/projects" aria-label="bettr home">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span>bettr</span>
        </a>
        <nav class="nav-list">
          <a href="#/recent" data-nav="recent"><span class="nav-icon" aria-hidden="true">◷</span><span>Recent</span></a>
        </nav>
        <section class="project-nav" aria-label="Projects">
          <div id="project-nav-list" class="project-nav-list" aria-live="polite"><span class="project-nav-state">Loading projects</span></div>
        </section>
        <div class="sidebar-spacer"></div>
        <div class="connection-state" id="connection-state" aria-live="polite">
          <span class="connection-dot" aria-hidden="true"></span>
          <span>Local database</span>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <div class="breadcrumbs" id="breadcrumbs"><span>Projects</span></div>
          <div class="topbar-actions">
            <div class="updated-control">
              <button class="updated-nav" id="updated-nav" type="button" aria-expanded="false" aria-controls="updated-menu" aria-label="Updated Issues" hidden>
                <span class="updated-nav-dot" aria-hidden="true"></span>
                <span id="updated-count" aria-live="polite"></span>
              </button>
              <div class="updated-menu" id="updated-menu" role="menu" aria-label="Updated Issues" hidden></div>
            </div>
            <span class="sync-label" id="sync-label">Checking…</span>
            <button class="icon-button" type="button" id="theme-toggle" aria-label="Toggle theme">◐</button>
          </div>
        </header>

        <main id="main" class="main-content" tabindex="-1">
          <div id="app" aria-busy="true">
            <div class="loading-state"><span class="loader" aria-hidden="true"></span><span>Loading local data</span></div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
